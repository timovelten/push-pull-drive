[package]
name = "push-pull-drive"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "1.0"
lazy_static = "1.4.0"
sha1 = "0.10.5"
filetime = "0.2.18"
clap = { version = "4.0.23", features = ["derive"] }
rusqlite = { version = "0.28.0", features = ["bundled", "time"] }
time = { version = "0.3.17", features = ["serde-well-known"] }
ureq = { version = "2.5.0", features = ["json"] }
url = "2.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
oauth2 = { version = "4.3.0", features = ["ureq"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }

[dev-dependencies]
tempfile = "3.3.0"

# Always compile dependencies with some level of optimization. Especially the hashing
# is painfully slow otherwise.
[profile.dev.package."*"]
opt-level=2
