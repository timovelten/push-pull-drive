[package]
name = "push-pull-drive"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "1.0"
sha1 = "0.10.5"
clap = { version = "4.0.23", features = ["derive"] }
rusqlite = { version = "0.30.0", features = ["bundled", "time"] }
time = { version = "0.3.31", features = ["serde-well-known"] }
url = "2.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
oauth2 = { version = "4.3.0" }
serde_urlencoded = "0.7.1"
http = "0.2.8"
tokio = { version = "1.22.0", features = ["full", "tracing"] }
async-recursion = "1.0.0"
tokio-util = { version = "0.7.4", features = ["compat"] }
futures = "0.3.25"
reqwest = { version = "0.11.13", features = ["stream", "json"] }
rand = "0.8.5"
pin-project-lite = "0.2.13"
log = "0.4.0"
env_logger = "0.10.0"
ahash = "0.8.7"
anyhow = "1.0.81"
hex = "0.4.3"
const_format = "0.2.32"
cached = { version = "0.49.2", default-features = false, features = ["ahash"] }
libc = "0.2.153"
either = "1.10.0"
crossterm = "0.27.0"
console-subscriber = "0.2.0"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.3.0"

# Always compile dependencies with some level of optimization. Especially the hashing
# is painfully slow otherwise.
[profile.dev.package."*"]
opt-level=2
