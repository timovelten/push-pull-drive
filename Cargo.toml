[workspace]
members = ["drive_api"]

[workspace.dependencies]
anyhow = "1.0.81"
tokio = { version = "1.22.0", features = ["fs", "rt", "rt-multi-thread", "sync", "macros"] }
time = { version = "0.3.31", features = ["serde-well-known"] }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["stream", "json"] }
serde_json = "1.0"
http = "1.1.0"
thiserror = "2.0"
futures = "0.3.25"
rand = { version = "0.10.0" }
log = { version = "0.4.21", features = ["std"] }
oauth2 = { version = "5.0.0" }
slotmap = "1.0.7"
pin-project-lite = "0.2"
env_logger = "0.11.5"

[package]
name = "push-pull-drive"
version = "0.1.0"
edition = "2024"

[dependencies]
drive_api = { path = "./drive_api" }

anyhow = { workspace = true }
tokio = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
slotmap = { workspace = true }
pin-project-lite = { workspace = true }
env_logger.workspace = true

cached = { version = "4.1.1", default-features = false, features = ["time_stores"] }
clap = { version = "4.0.23", features = ["derive"] }
rusqlite = { version = "0.41.1", features = ["bundled", "time"] }
async-recursion = "1.2.0"
tokio-util = { version = "0.7.4", features = ["compat"] }
crossterm = "0.29"
walkdir = "2.5.0"
tempfile = "3.10.1"
delegate = "0.13.1"
static_assertions = "1.1.0"
strum = { version = "0.28.0", features = ["derive"] }
memchr = "2.7.4"
anstream = "1.0.0"
anstyle = "1.0.10"

[dev-dependencies]
test-log = "0.2.15"
rand.workspace = true

# Always compile dependencies with some level of optimization.
[profile.dev.package."*"]
opt-level=1
