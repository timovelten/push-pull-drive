[workspace]
members = ["drive_api"]

[workspace.dependencies]
anyhow = "1.0.81"
tokio = { version = "1.22.0", features = ["fs", "rt", "rt-multi-thread", "sync", "macros"] }
time = { version = "0.3.31", features = ["serde-well-known"] }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12.9", features = ["stream", "json"] }
serde_json = "1.0"
http = "1.1.0"
thiserror = "2.0"
futures = "0.3.25"
rand = { version = "0.8.5", features = ["small_rng"] }
log = { version = "0.4.21", features = ["std"] }
oauth2 = { version = "4.3.0" }
slotmap = "1.0.7"
pin-project-lite = "0.2"
env_logger = "0.11.5"

# Has better error messages than assert!(matches!(...))
assert_matches = "1.5.0"

[package]
name = "push-pull-drive"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
drive_api = { path = "./drive_api" }

anyhow = { workspace = true }
tokio = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
slotmap = { workspace = true }
pin-project-lite = { workspace = true }
env_logger.workspace = true

cached = { version = "0.54.0", default-features = false, features = ["ahash"] }
hex = "0.4.3"
sha1 = "0.10.5"
clap = { version = "4.0.23", features = ["derive"] }
rusqlite = { version = "0.32.1", features = ["bundled", "time"] }
async-recursion = "1.0.0"
tokio-util = { version = "0.7.4", features = ["compat"] }
ahash = "0.8.7"
libc = "0.2.153"
either = "1.10.0"
crossterm = "0.28.1"
walkdir = "2.5.0"
tempfile = "3.10.1"
delegate = "0.13.1"
static_assertions = "1.1.0"
strum = { version = "0.26.3", features = ["derive"] }

[dev-dependencies]
test-log = "0.2.15"
rand.workspace = true
assert_matches.workspace = true

# Always compile dependencies with some level of optimization. Especially the hashing
# is painfully slow otherwise.
[profile.dev.package."*"]
opt-level=2
